<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demian Consultoría | Enfermería Legal y Peritaje Judicial</title>
    <!-- Fuentes y estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-marino: #1E3A8A;
            --lila-principal: #8B5CF6;
            --lila-hover: #7C3AED;
            --fondo-gris: #F8FAFC;
            --texto-oscuro: #1E293B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--fondo-gris);
            color: var(--texto-oscuro);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            padding: 20px;
        }

        /* Logo */
        .logo-container {
            margin-bottom: 25px;
        }

        .logo-container img {
            max-width: 280px;
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.1);
        }

        /* Títulos */
        h1 {
            color: var(--azul-marino);
            font-size: 1.5rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #475569;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* Sección de enlaces / Botones */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            background-color: #ffffff;
            color: var(--azul-marino);
            border: 2px solid var(--azul-marino);
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .btn-link:hover {
            background-color: var(--azul-marino);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 58, 138, 0.2);
        }

        /* Botón destacado WhatsApp */
        .btn-link.highlight {
            background-color: var(--lila-principal);
            color: #ffffff;
            border: none;
        }

        .btn-link.highlight:hover {
            background-color: var(--lila-hover);
        }

        /* Footer */
        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #94A3B8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo-container">
            <img src="logo.png" alt="Paola Arriagada Cifuentes - Perito Judicial en Enfermería">
        </div>

        <!-- Encabezado -->
        <h1>Paola Arriagada Cifuentes</h1>
        <p class="subtitle">Perito Judicial en Enfermería<br>Especialista en Enfermería Legal</p>

        <!-- Botones de Acción (Tu nuevo centro de enlaces) -->
        <div class="links-container">
            
            <!-- WhatsApp (Reemplaza con tu número de teléfono de 9 dígitos después del 569) -->
            <a href="https://wa.me/569XXXXXXXX?text=Hola,%20quisiera%20consultar%20sobre%20tus%20servicios" class="btn-link highlight" target="_blank">
                💬 Contactar por WhatsApp
            </a>

            <!-- Correo -->
            <a href="mailto:demianconsultoria@gmail.com" class="btn-link">
                ✉️ Enviar un Correo
            </a>

            <!-- Clases / Talleres (Aquí conectaremos Flow) -->
            <a href="#" class="btn-link">
                📚 Cursos, Clases y Talleres
            </a>

            <!-- Encuestas / Formularios -->
            <a href="#" class="btn-link">
                📋 Encuestas y Formularios
            </a>

        </div>

        <footer>
            © 2026 Demian Consultoría — www.demianconsultoria.cl
        </footer>
    </div>

</body>
</html>
